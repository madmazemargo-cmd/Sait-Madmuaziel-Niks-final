name = "madmuazelle-niks-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"

[vars]
# Set this to the exact public origin in the Cloudflare dashboard for production.
ALLOWED_ORIGIN = "https://sait-madmuaziel-niks-final.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "madmuazelle-niks"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../migrations"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
